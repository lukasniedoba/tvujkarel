name: Deploy AWS preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: tvujkarel-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - run: npm run build && npm run build:infra
        env:
          PUBLIC_SITE_MODE: preview
          CONTACT_MODE: disabled
          PUBLIC_SITE_URL: https://tvujkarel.cz
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::541855874226:role/tvujkarel-github-deploy
          aws-region: eu-central-1
          allowed-account-ids: '541855874226'
      - run: node node_modules/aws-cdk/bin/cdk synth -c certificateArn="$CERTIFICATE_ARN"
        env:
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
      - run: node node_modules/aws-cdk/bin/cdk diff TvujKarelHosting --app cdk.out --no-change-set
      - run: node node_modules/aws-cdk/bin/cdk deploy TvujKarelHosting --app cdk.out --require-approval never --parameters OriginToken="$ORIGIN_TOKEN" --parameters AlertEmail="$ALERT_EMAIL" --parameters MonthlyBudgetUsd="$MONTHLY_BUDGET_USD"
        env:
          ORIGIN_TOKEN: ${{ secrets.CONTACT_ORIGIN_TOKEN }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
      - run: mkdir -p .deployment && node scripts/verify-deployment.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-assembly-${{ github.run_id }}
          path: |
            cdk.out/
            .deployment/verification.json
          retention-days: 30
